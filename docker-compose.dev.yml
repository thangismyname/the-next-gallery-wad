# ==========================================================
# DEV COMPOSE — The Next Gallery
# - Postgres + MinIO riêng, độc lập hoàn toàn với AI_Gallery_System cũ
# - Mặc định chỉ chạy infra (postgres + minio): `docker compose up postgres minio`
#   -> FE/BE chạy native (npm run dev) cho hot reload nhanh trên macOS
# - Khi cần test full container: `docker compose --profile full up`
# ==========================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: next_gallery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"   # host port 5433 để không đụng Postgres/MariaDB cũ (5432/3306)
    volumes:
      - next_gallery_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: next_gallery_minio
    restart: unless-stopped
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9002:9000"   # API — đổi port để không đụng MinIO cũ (thường 9000)
      - "9091:9091"   # Console
    volumes:
      - next_gallery_minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Các service dưới đây KHÔNG tự chạy khi gõ `docker compose up`.
  # Chỉ chạy khi có --profile full. Dùng cho lúc cần test
  # giống production hoặc để người khác chạy thử toàn bộ stack.
  # ----------------------------------------------------------
  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: gallery_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432   # port NỘI BỘ trong network Docker, không phải 5433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: "http://localhost:3000"
      CORS_ORIGINS: "http://localhost:5173"
      TRUSTED_ORIGINS: "http://localhost:5173"
      # Semantic search: backend gọi ai-service để embed ảnh/text
      AI_SERVICE_URL: "http://ai-service:8000"
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: npm run dev

  frontend:
    profiles: ["full"]
    build:
      # Gốc repo: frontend dùng packages/shared (npm workspaces)
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: gallery_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:3000/api"
    volumes:
      - ./frontend:/repo/frontend
      - ./packages/shared:/repo/packages/shared
      - /repo/node_modules
      - /repo/frontend/node_modules
    networks:
      - internal
    depends_on:
      backend:
        condition: service_started   # dev ưu tiên tốc độ, không cần chờ healthy
    command: npm run dev --workspace=frontend -- --host 0.0.0.0

  ai-service:
    profiles: ["full"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
      args:
        CLIP_MODEL: ${AI_CLIP_MODEL:-ViT-B-32}
        CLIP_PRETRAINED: ${AI_CLIP_PRETRAINED:-laion2b_s34b_b79k}
    container_name: gallery_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      AI_EMBED_PROVIDER: open_clip
      AI_CLIP_MODEL: ${AI_CLIP_MODEL:-ViT-B-32}
      AI_CLIP_PRETRAINED: ${AI_CLIP_PRETRAINED:-laion2b_s34b_b79k}
      # Object detection (YOLO26) — weights bake sẵn ở /opt/yolo-cache (ngoài /app,
      # không bị volume ./ai-service:/app che khuất).
      AI_OBJECT_PROVIDER: ${AI_OBJECT_PROVIDER:-yolo}
      AI_YOLO_WEIGHTS: /opt/yolo-cache/${AI_YOLO_MODEL:-yolo26n.pt}
      AI_YOLO_CONF: ${AI_YOLO_CONF:-0.25}
      # Similar photos (DINOv3) — weights are gated (not baked): download them into
      # ai-service/models/ (scripts/download_dino_weight.py); the volume below
      # mounts that folder at /app/models. Without this the service runs "stub".
      AI_SIMILARITY_PROVIDER: ${AI_SIMILARITY_PROVIDER:-stub}
      AI_DINO_MODEL: ${AI_DINO_MODEL:-models/dinov3-vits16-pretrain-lvd1689m}
      AI_DINO_DEVICE: ${AI_DINO_DEVICE:-auto}
      # Admin Lab (/admin/lab) đọc kết quả experiments — chỉ mount Results + History, read-only.
      TNG_DATASETS: /datasets
    volumes:
      - ./ai-service:/app
      - ${TNG_DATASETS:-./database/datasets}/Results:/datasets/Results:ro
      - ${TNG_DATASETS:-./database/datasets}/History:/datasets/History:ro
    networks:
      - internal
    depends_on: []

  # TURN thử ở máy dev (tuỳ chọn): --profile turn, đặt TURN_SECRET và
  # TURN_URLS=turn:<IP LAN của máy>:3478 trong .env.
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    container_name: gallery_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-dev-turn-secret}
      - --realm=the-next-gallery
      - --no-cli
      - --no-tls
      - --no-dtls

networks:
  internal:
    driver: bridge

volumes:
  next_gallery_pgdata:
  next_gallery_minio_data:
