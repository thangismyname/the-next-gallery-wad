version: "3.9"
# ==========================================================
# PRODUCTION COMPOSE — The Next Gallery
# - Chỉ reverse-proxy expose port ra ngoài (80/443)
# - backend/frontend/postgres/minio nằm hoàn toàn trong network internal
# - Chuẩn bị sẵn cho mobile app: FE web và Flutter app đều gọi
#   qua cùng 1 domain HTTPS (vd: https://api.yourgallery.com)
# ==========================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gallery_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  minio:
    image: minio/minio:latest
    container_name: gallery_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: gallery_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - internal
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: gallery_backend
    restart: always
    # KHÔNG expose port ra host — chỉ reverse-proxy nói chuyện được với backend
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: 10
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_API_BASE_URL_ROOT}
      # CORS_ORIGINS nên gồm cả domain FE web lẫn scheme app mobile nếu cần (vd: capacitor://localhost)
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-${CORS_ORIGINS}}
      # Container không có file .env gốc → mọi biến backend đọc phải khai ở đây.
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-}
      MEDIA_URL_TTL_HOURS: ${MEDIA_URL_TTL_HOURS:-24}
      # Đăng nhập Google / GitHub: để trống = tắt.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Email đặt lại mật khẩu: SMTP_USER / SMTP_PASS trống = tắt.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AI_SERVICE_URL: http://ai-service:8000
      REDIS_URL: redis://redis:6379
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      AI_CLIP_MIN_SIM: ${AI_CLIP_MIN_SIM:-0.22}
      AI_YOLO_MIN_CONF: ${AI_YOLO_MIN_CONF:-0.4}
      AI_DINO_MIN_SIM: ${AI_DINO_MIN_SIM:-0.35}
      AI_SEARCH_MIN_SCORE: ${AI_SEARCH_MIN_SCORE:-0.5}
      # Gửi file P2P: STUN mặc định Google; TURN (coturn, profile "turn") —
      # TURN_URLS vd "turn:gallery.example.com:3478?transport=udp,turn:gallery.example.com:3478?transport=tcp".
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
    networks:
      - internal
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      # Gốc repo: frontend dùng packages/shared (npm workspaces)
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    container_name: gallery_frontend
    restart: always
    expose:
      - "80"
    networks:
      - internal
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
      args:
        CLIP_MODEL: ${AI_CLIP_MODEL:-ViT-B-32}
        CLIP_PRETRAINED: ${AI_CLIP_PRETRAINED:-laion2b_s34b_b79k}
    container_name: gallery_ai_service
    restart: always
    expose:
      - "8000"
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      AI_EMBED_PROVIDER: ${AI_EMBED_PROVIDER:-stub}
      AI_CLIP_MODEL: ${AI_CLIP_MODEL:-ViT-B-32}
      AI_CLIP_PRETRAINED: ${AI_CLIP_PRETRAINED:-laion2b_s34b_b79k}
      AI_OBJECT_PROVIDER: ${AI_OBJECT_PROVIDER:-stub}
      AI_YOLO_WEIGHTS: ${AI_YOLO_WEIGHTS:-/opt/yolo-cache/yolo26n.pt}
      AI_YOLO_CONF: ${AI_YOLO_CONF:-0.25}
      AI_YOLO_IMGSZ: ${AI_YOLO_IMGSZ:-640}
      AI_SIMILARITY_PROVIDER: ${AI_SIMILARITY_PROVIDER:-stub}
      AI_DINO_MODEL: ${AI_DINO_MODEL:-facebook/dinov3-vits16-pretrain-lvd1689m}
      AI_TAG_CONFIG: ${AI_TAG_CONFIG:-lp_clip}
    networks:
      - internal
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3G # CLIP + YOLO26 (+ DINOv3) trên CPU — 512M không đủ nạp model

  reverse-proxy:
    image: caddy:2-alpine
    container_name: gallery_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    logging: *default-logging
    depends_on:
      - backend
      - frontend

  # TURN (coturn) — WebRTC đi vòng qua máy chủ khi 2 máy không nối thẳng được
  # (4G/CGNAT, mạng công ty). Bật: --profile turn + TURN_SECRET/TURN_URLS/TURN_EXTERNAL_IP.
  # Dùng network host: TURN cần UDP 3478 + dải port relay trên IP công khai (mở firewall).
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    container_name: gallery_coturn
    restart: always
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-the-next-gallery}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --no-cli
      - --no-tls
      - --no-dtls
      # Chặn dùng TURN để chui vào mạng nội bộ của server.
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
  caddy_data:
  caddy_config: